[package]
name = "vbt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reads the live round score off VALORANT esports broadcasts and publishes it"
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "vbt"

[dependencies]
vbt-vision = { path = "../vision" }
vbt-scoreboard = { path = "../scoreboard", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
getrandom = "0.3"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "macros"] }
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[features]
default = ["scoreboard"]
scoreboard = ["dep:vbt-scoreboard"]

[dev-dependencies]
# The ledger tests parse the RFC 3339 `at` key.
time = { version = "0.3", features = ["parsing"] }

[[bin]]
name = "vbt"
path = "src/main.rs"

[[bin]]
name = "vbt-probe"
path = "src/bin/vbt-probe.rs"
