[package]
name = "vbt-scoreboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Buy-phase table, map-strip and team-tag readers over a PP-OCRv6 recognition model"
license = "MIT AND Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
vbt-vision = { path = "../vision" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
hmac-sha256 = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
